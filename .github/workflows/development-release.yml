name: Development Release

on:
  push:
    branches:
      - v2

concurrency:
  group: development-release-v2
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      prerelease: alpha

  update-release:
    needs: publish
    if: needs.publish.outputs.version != '' && needs.publish.outputs.commit != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update rolling alpha prerelease
        uses: actions/github-script@v7
        env:
          PUBLISHED_VERSION: ${{ needs.publish.outputs.version }}
          PUBLISHED_COMMIT: ${{ needs.publish.outputs.commit }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = process.env.PUBLISHED_VERSION;
            const sha = process.env.PUBLISHED_COMMIT;
            if (!/^\d+\.\d+\.\d+-alpha\.\d+$/.test(version) || !/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('Invalid published alpha version or commit');
            }

            const tag = 'alpha';
            let tagExists;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
            }

            if (tagExists) {
              await github.rest.git.updateRef({
                owner, repo, ref: `tags/${tag}`, sha, force: true
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha
              });
            }

            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner, repo, tag
              });
              release = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const details = {
              owner, repo,
              tag_name: tag,
              target_commitish: sha,
              name: 'Development alpha',
              body: [
                'Rolling development prerelease from `v2`.',
                '',
                `Published package and container version: \`${version}\`.`,
                `Published commit: ${sha}.`,
                '',
                'This prerelease and its alpha tag move after each successful development publish.'
              ].join('\n'),
              draft: false,
              prerelease: true,
              make_latest: 'false'
            };
            if (release) {
              await github.rest.repos.updateRelease({
                ...details, release_id: release.id
              });
            } else {
              await github.rest.repos.createRelease(details);
            }
