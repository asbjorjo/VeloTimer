name: 'Publish'

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Prerelease tag (optional)
        required: false
        type: string
        default: ''

jobs:
  publish-new-version:
    runs-on: ubuntu-latest
    env:
      OIDC_AUDIENCE: https://build.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Setup git
        run: |
          git config --local user.email "514378+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Version Bump
        env:
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: >
          dotnet tool run versionize -- --exit-insignificant-commits
          ${{ env.PRERELEASE != '' && format('--pre-release {0}', env.PRERELEASE) || '' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Solution
        run: dotnet build --configuration Release

      - name: Build Package
        run: dotnet pack --output nupkgs --configuration Release

      - name: Push to Nuget
        run: dotnet nuget push "nupkgs/*.nupkg" -s https://nuget.pkg.github.com/asbjorjo/index.json -k ${{secrets.GITHUB_TOKEN}} --skip-duplicate

      - name: Push to GHCR
        run: dotnet publish --configuration Release /t:PublishContainer -p ContainerRegistry=ghcr.io

      - name: Push changes to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true
