{{- define "velotime.migration" -}}
{{- if .Values.migration.enabled -}}
initContainers:
- name: {{ .Chart.Name }}-migration
  image: "{{ .Values.global.image.repository }}velotime-module-{{ .Values.module }}-migration:{{ .Values.global.image.tag }}"
  imagePullPolicy: {{ $.Values.migration.image.pullPolicy }}
  envFrom:
    {{- with .Values.configMap }}
    {{- if .enabled }}
    - configMapRef:
        name: {{ include "velotime.fullname" $ }}
    {{- end }}
    {{- end }}
    - secretRef:
        name: {{ .Values.existingSecret | default (include "velotime.fullname" .) }}
{{- end -}}
{{- end -}}