{{- define "velotime.service" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "velotime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: default
  selector:
    {{- include "velotime.selectorLabels" . | nindent 4 }}
{{- end -}}