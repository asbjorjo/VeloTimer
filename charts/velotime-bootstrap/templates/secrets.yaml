{{- if not .Values.existingSecret }}
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ include "velotime.fullname" . }}
  labels:
    {{- include "velotime.labels" . | nindent 4 }}
stringData:
  VELOTIMEDB_PASSWORD: ""
  VELOTIMEDB_URI: ""
  ConnectionStrings__velotimedb: ""
type: "Opaque"
{{- end }}