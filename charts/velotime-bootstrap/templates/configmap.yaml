apiVersion: v1
kind: ConfigMap
metadata:
  {{- if .Values.global.oidcAuthority }}
  name: {{ include "velotime.fullname" . }}
  {{- else }}
  name: {{ .Release.Name }}-{{ .Chart.Name }}
  {{- end }}
  {{- if .Values.global.oidcAuthority }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
{{- if .Values.global.oidcAuthority }}
data:
  {{- include "velotime.oidcConfig" . | nindent 2 }}
{{- else }}
data: {}
{{- end }}
