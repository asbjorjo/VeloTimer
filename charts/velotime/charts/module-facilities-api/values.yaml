module: facilities
# When set, this Secret replaces the chart-managed Secret. It must include
# ConnectionStrings__MessageBus alongside the existing database/cache keys.
existingSecret: ""
oidcAudience: ""
cache:
  host: cache-service
  port: 1234
  password: ""
database:
  host: postgres-service
  port: 5432
  user: velotime
  password: ""
secrets:
  # Supply through private deployment values, or use existingSecret above.
  # Umbrella chart path: module-facilities-api.secrets.MessageBus.
  # Broker topics/subscriptions and retention are provisioned externally.
  MessageBus: ""
image:
  tag: 3.0.0.alpha.11
  pullPolicy: Always
ports:
- name: http
  containerPort: 8080
  protocol: TCP
httpRoute:
  enabled: true
  parentRefs:
  - name: gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/facilities
service:
  type: ClusterIP
  port: 80
migration:
  enabled: true
  image:
    pullPolicy: IfNotPresent
global:
  image:
    repository: ""
podAnnotations:
  instrumentation.opentelemetry.io/inject-dotnet: 'true'
