{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velotime.fullname" . }}
  labels:
    {{- include "velotime.labels" . | nindent 4 }}
stringData:
  VELOTIMEDB_PASSWORD: {{ .Values.database.password | quote }}
  VELOTIMEDB_URI: {{ include "velotime.databaseUri" .Values.database | quote }}
  ConnectionStrings__velotimedb: {{ include "velotime.connectionStringPostgres" .Values.database | quote }}
type: Opaque
{{- end }}
