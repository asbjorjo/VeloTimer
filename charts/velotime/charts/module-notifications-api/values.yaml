existingSecret: ""
oidcAudience: ""
replicaCount: 1
cache:
  host: cache-service
  port: 6379
  user: default
  password: ""
database:
  host: postgres-service
  port: 5432
  user: velotime
  password: ""
sessionAssertion:
  issuer: ""
  audience: ""
  keyId: ""
  publicKeyPem: ""
  maximumLifetimeSeconds: 120
  clockSkewSeconds: 5
image:
  pullPolicy: IfNotPresent
migration:
  enabled: true
  image:
    pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
httpRoute:
  # The API is consumed by WebUI over in-cluster service discovery. Do not
  # publish its cookie-less routes on the browser Gateway by default.
  enabled: false
  parentRefs:
    - name: gateway
  # If explicitly enabled, route only on a dedicated API hostname that is
  # distinct from the WebUI browser hostname.
  hostnames: []
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/notifications
global:
  image:
    repository: ghcr.io/asbjorjo/
    tag: 2.1.0-alpha.33
  oidcAudience: ""
  oidcAuthority: ""
  imagePullSecrets:
    - name: ghcr
