apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-profiles-migration" .Release.Name | trunc 63 | trimSuffix "-" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-10"
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: profiles-migration
          image: "{{ .Values.global.image.repository }}velotime-module-profiles-migration:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ required "Profiles existingSecret must contain ConnectionStrings__profilesdb" .Values.existingSecret | quote }}
