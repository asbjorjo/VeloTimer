apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "velotime-users-migration.fullname" $ }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  services__module-statistics-api__http__0: "http://module-statistics-api/"
  services__module-timing-api__http__0: "http://module-timing-api/"
  {{- include "velotime.oidcConfig" . | nindent 2 }}